# https://waha.devlike.pro/docs/how-to/install/
services:
  waha:
    restart: always
    # Build from source (removes session name restriction)
    # Using NOWEB-optimized Dockerfile for faster builds and smaller image
    build:
      context: .
      dockerfile: Dockerfile.noweb

    # Add "dns" if you have a problem with resolving "web.whatsapp.com"
    dns:
      - 1.1.1.1
      - 8.8.8.8

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    ports:
      - '47823:3000/tcp'

    volumes:
      # Store sessions in the .sessions folder (comment it if you're using MongoDB)
      - './sessions:/app/.sessions'

      # Save media files
      # https://waha.devlike.pro/docs/how-to/storages/#save-media-files-between-the-container-restarts
      - './media:/app/.media'

    env_file:
      - .env

    # Coolify marks compose containers without a healthcheck as "unhealthy".
    # /ping is unauthenticated and tier-independent (unlike /health, Plus-only).
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # India 4G exit for WhatsApp sockets: userspace Tailscale node routing via an
  # Android phone exit node. Sessions opt in with
  # config.proxy.server = "ts-bridge:8080". Internal network only — no ports mapped.
  #
  # The exit node is managed at RUNTIME by scripts/ts-bridge-failover.sh
  # (fallback chain: phone1 -> phone2 -> direct Hetzner egress), NOT via
  # TS_EXTRA_ARGS — so containerboot always starts even when every phone is
  # offline, and the proxy at :8080 never goes down with a phone.
  # Design: docs/superpowers/specs/2026-07-13-tailscale-exit-node-failover.md
  # (supersedes docs/superpowers/specs/2026-06-24-android-4g-proxy-bridge-design.md)
  ts-bridge:
    # Built from source (Dockerfile.tsbridge, FROM tailscale/tailscale:v1.98.8):
    # the watchdog script + curl/jq/psql are BAKED IN. A bind mount does not
    # work here — Coolify rewrites relative binds to a host path that lacks the
    # repo, docker then creates an empty DIRECTORY at /failover.sh, and the
    # container crash-loops (observed 2026-07-13).
    build:
      context: .
      dockerfile: Dockerfile.tsbridge
    restart: always
    hostname: waha-ts-bridge
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_USERSPACE=true
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=0.0.0.0:8080
      - TS_STATE_DIR=/var/lib/tailscale
      # Auth once, then reuse the persisted node identity: on restarts
      # containerboot skips `tailscale up` entirely (uses `tailscale set`
      # internally), so a runtime pref set by the watchdog can never trip
      # "changing settings via 'tailscale up' requires mentioning all
      # non-default flags" (crash-looped the bridge for 9h on 2026-07-17),
      # and an expired TS_AUTHKEY can't break a registered node.
      - TS_AUTH_ONCE=true
      # When `tailscale up` DOES run (first boot / after a state wipe / node
      # key expired -> NeedsLogin), --reset makes it immune to any persisted
      # non-default prefs. Ops: disable key expiry for this node in the
      # Tailscale admin console (default node-key expiry is 180 days).
      - TS_EXTRA_ARGS=--reset
      # Serves /healthz on :9002 (TS_LOCAL_ADDR_PORT default) once tailscale is up.
      - TS_ENABLE_HEALTH_CHECK=true
      # --- failover watchdog (scripts/ts-bridge-failover.sh) ---
      - PHONE_TS_IP=${PHONE_TS_IP}
      - PHONE_TS_IP_2=${PHONE_TS_IP_2:-}
      - DB_URL=${BAN_PREVENTION_DATABASE_URL}
      # The watchdog needs the PLAIN key: if WAHA_API_KEY is stored hashed
      # (sha512:...), set WAHA_API_KEY_PLAIN too — the script prefers it.
      # (No nested ${A:-${B}} here: Coolify's env parser cannot read it.)
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_API_KEY_PLAIN=${WAHA_API_KEY_PLAIN:-}
      - WAHA_URL=http://waha:3000
      # Tuning (defaults shown; override via Coolify env if needed)
      - FAILOVER_CHECK_INTERVAL=${FAILOVER_CHECK_INTERVAL:-20}
      - FAILOVER_FAIL_THRESHOLD=${FAILOVER_FAIL_THRESHOLD:-3}
      - FAILOVER_RECOVERY_CHECKS=${FAILOVER_RECOVERY_CHECKS:-15}
      - FAILOVER_MIN_DWELL=${FAILOVER_MIN_DWELL:-1800}
      - FAILOVER_QUARANTINE=${FAILOVER_QUARANTINE:-3600}
      - FAILOVER_CHECK_URLS=${FAILOVER_CHECK_URLS:-https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip}
    volumes:
      # -2: fresh state store. The original ts-bridge-state volume (written by
      # older tailscale/tailscale:latest containers) made tailscaled/containerboot
      # die pre-login on v1.98.8 in prod, while a fresh state store logs in fine
      # (verified 2026-07-14 by running the same image+authkey with clean state).
      - ts-bridge-state-2:/var/lib/tailscale
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9002/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

  # One-shot deploy-time probe: verifies the ts-bridge proxy egresses via the
  # India exit node. Writes results to Postgres (BAN_PREVENTION_DATABASE_URL db,
  # table ts_bridge_probe) since container logs are not remotely readable.
  ts-probe:
    image: alpine:3.20
    restart: 'no'
    depends_on:
      - ts-bridge
    environment:
      - DB_URL=${BAN_PREVENTION_DATABASE_URL}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl postgresql16-client >/dev/null 2>&1
        psql "$$DB_URL" -c "CREATE TABLE IF NOT EXISTS ts_bridge_probe(at timestamptz DEFAULT now(), attempt int, dns text, direct_ip text, proxy_result text, healthz text);" || true
        psql "$$DB_URL" -c "ALTER TABLE ts_bridge_probe ADD COLUMN IF NOT EXISTS healthz text;" || true
        for i in 1 2 3 4; do
          sleep 25
          DNS=$$(getent hosts ts-bridge 2>&1 | tr -d "'\"" || echo NO_DNS)
          DIRECT=$$(curl -sS -m 10 https://api.ipify.org 2>&1 | tr -d "'\"" || true)
          PROXY=$$(curl -sS -m 20 -x http://ts-bridge:8080 https://api.ipify.org 2>&1 | tr -d "'\"" || true)
          HEALTH=$$(curl -sS -m 5 http://ts-bridge:9002/healthz 2>&1 | tr -d "'\"" || true)
          psql "$$DB_URL" -c "INSERT INTO ts_bridge_probe(attempt, dns, direct_ip, proxy_result, healthz) VALUES ($$i, '$${DNS:-empty}', '$${DIRECT:-empty}', '$${PROXY:-empty}', '$${HEALTH:-empty}');" || true
        done

